schema_version: "1.0"
id: "meaning-probes-zodiac-numerals-opener-labels"
kind: research
title: "Meaning probes: zodiac labels are not a numeral system (three well-powered nulls), no entry formula in the Recipes openers, no ending-based name/grammar split; 0 new meanings"
summary: >-
  First pass in the family that tries to read something rather than to fake it. Six
  pre-registered gates at the glyph-unit level fixed by PR #12 (the frozen 20-merge list),
  each with held-out splits, calibrated positive controls and three adversarial verifiers.
  Nothing passed; new verified word meanings: 0. Three of the failures are results because
  they carry measured detection floors. (1) The 294 zodiac nymph labels are not a written
  numeral system: neighbours share no material (delta +0.006, p 0.56, 0.15 of a detection
  floor that all eight real numeral systems exceed by 2.6-5.9x), no same-slot correspondence
  across signs under three conventions or any rotation (implanted numbering is detected at
  5% of labels), no positional morphology; and 258 of 294 label strings are distinct where a
  restarting series predicts about 0.10. (2) The Recipes paragraph openers are 89.6%
  gallows-initial against 5.5% for line openers inside paragraphs (31.8 SD), but no opener
  word type reaches 3% where an Item/Take/Recipe formula would need 10%, so there is no
  lexical entry formula; whether the opener gallows is an ornament is NOT MEASURABLE with
  the registered statistic (invalid resampling null and an unfrozen control-pool scope,
  disclosed). (3) No ending-based name/grammar split: 2 of 25 word-final glyph units clear
  the gate where the Culpeper heading-vs-body control clears 4, and both dissolve under
  type-level deduplication. (4) The drawn stars do not index the text. One observation
  outside every registered family is reported without a claim: label words are strongly
  depleted in EVA q-initial forms relative to length-matched running text on the same page
  (log-odds -1.687, exact P 2.6e-18 held-out), proposed as the next pre-registered gate.
