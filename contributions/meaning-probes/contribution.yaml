outcomes:
  - id: "outcome-meaning-probes"
    family_id: "family-generative-falsification"
    extends: "outcome-discriminating-tests"
    before: >-
      No pass in the repository had attempted to read anything; the zodiac labels, the
      Recipes paragraph openers and the label register had never been tested for
      numerals, an entry formula or a name/grammar split with calibrated power.
    after: >-
      The zodiac labels are excluded as a written numeral system down to about a quarter of
      real numeral strength (three independent probes, all calibrated); the Recipes openers
      carry no lexical entry formula; the drawn stars do not index the text; no
      ending-based name/grammar split exists at the level the Culpeper control detects.
      The ornament-versus-word question about the opener gallows is identified as not
      measurable with the registered design. The q-initial depletion of labels is stated as
      the next hypothesis. New verified meanings: 0.
    acceptance_test: >-
      Run the four test scripts; confirm results/: Z1 delta +0.00612 p 0.5616 on TEST with
      all eight numeral controls at p 0.0001; Z2 convention A effect -0.00498 p 0.64; Z3
      distinct/total 0.878; R1a 89.6% vs 5.5%; R1c top opener type 4 of 134; L1 2 of 25
      units vs control 4 of 25; R2 nothing survives Bonferroni; q-initial merged log-odds
      about -1.69 with exact conditional P about 2.6e-18 on TEST.
