  - "The ornament-versus-word branch of R1 is not measurable with the registered statistic; it needs a rebuilt design."
  - "Two unregistered analysis choices (Z4 remainder rule, L1 continuity constant) each decided a gate outcome; both are disclosed and Z4's JSON PASS is overridden to FAIL in the report."
