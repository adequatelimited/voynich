rubric_version: "0.1"
conflicts: []
limitations:
  - "The R2.1 type-ratio gate was calibrated to the contaminated count; the verdict is reported as frozen and the post-hoc reading is labelled."
  - "Only five untuned cipher families were tried; failure to reproduce is weak evidence by design."
  - "Level (c) glyph identities (iin/in/ii/ee as single glyphs) are an assumption, stated, not established."
  - "Skeat's Middle English edition regularises spelling; a diplomatic transcription would be a stronger orthography control."
  - "Size-matched control comparisons remain confounded by entry length."
  - "The alternating page split makes FIT and TEST halves statistically near-identical, so R5.3 (selection optimism) has little power; the held-out design mainly tests the FIT-only habit tables."
  - "gen_m2 was replaced by an exact-semantics Fenwick-tree version for speed; equality with the vendored original is asserted at start-up on 3,000 tokens."
  - "The re-segmentation crossover at 45 symbols is against Greek, whose raw alphabet already has 45 symbols because accented vowels are separate letters; against Latin, Finnish, Italian and English the gap at 45-60 symbols is still 0.2-0.6 bits. The association-criterion sensitivity closes the gap less (0.21 bits)."
  - "The illustration test's positive control fails with the pre-registered whole-entry Jaccard statistic; the size-corrected content-word variant that gives it power is exploratory and not yet pre-registered."
  - "Plant identifications are published proposals compiled in the ZL3b comments, uncertain and sometimes multiple; 'same plant' cross-references are marked '?' in most cases."
