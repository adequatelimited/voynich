schema_version: "1.0"
id: "adversarial-critique-generative-family"
kind: research
title: "Adversarial critique of the generative-falsification family: parser contamination, alphabet confound, cipher advocate, structure nulls"
summary: >-
  Pre-registered adverse experiments against the family's own claims (PRs #3-#9), with
  frozen decision rules committed before the run. Findings: (1) the shared corpus parser
  leaves IVTFF mark-up inside tokens, so 2,454 of the published 10,120 types are artefacts;
  every headline number must be restated (clean: 7,252 or 8,746 types at 35k tokens
  depending on uncertain-space treatment, versus Latin 7,144). (2) The letter-pair
  constraint (H2|1) is robust to transcription alphabet (0.80 bits below every language after
  identical glyph and determinism merging). (3) The final-glyph anomaly is alphabet-dependent
  (0.27 to 0.08 bits against Finnish). (4) An untuned verbose cipher of real Latin reproduces
  both entropy residues; the frozen type-ratio gate, calibrated to the contaminated count, is
  the only gate it fails. (5) The "2x neighbouring-page sharing" is a Currier-language and
  section artefact (within-block ratio 1.14); the "30% page-private" figure is 19% after
  decontamination, of which 17 points are expected from hapax richness alone. (6) Middle
  English orthography does not reach the manuscript's type ratio. (7) A pre-registered clean
  re-run of all five generators (habit tables from a FIT half, selection on FIT, scoring on a
  held-out TEST half, both uncertain-space treatments) reverses the family's ranking: the
  simplest model (M2) is best, the flagship grille (M5b) drops from composite 0.50 to
  0.84-1.14, no model matches more than 3 of 9 properties and none matches the entropy, Zipf
  or hapax-share residues; a dead parameter in pilot 1's grid is documented. (8) Twelve
  untuned ciphers with corrected five-way gates reproduce the entropy residues but not the
  joint fingerprint: short words, 70% hapax share and H2|1 ~2.1 are not delivered together.
  (9) Two further pre-registered tests: data-chosen re-segmentation (hypothesis by Vasily
  Gnuchev: two EVA symbols are one glyph) shows the letter-pair anomaly is
  SEGMENTATION-DEPENDENT by the frozen rule - twenty frequency-chosen merges (ch, dy, ai, ok,
  ol, ee, sh, in, che, aiin, ...) bring the manuscript to the lowest language's H2|1 at the
  same alphabet size (45; Greek, whose raw alphabet already has 45 symbols), with the gap to
  Latin/Finnish/English still 0.2-0.6 bits at 45-60 symbols and under 0.1 bit after 60 merges;
  and an illustration-linked-vocabulary test (same-plant herbal/pharmaceutical pairs and
  plant-identification pairs) that is UNDERPOWERED by its own gate because its positive
  control (Culpeper related-plant entries) shows no whole-entry excess; an exploratory
  size-corrected content-word variant gives the control power and shows no excess in the
  manuscript, queued for pre-registration as T1 v2.
