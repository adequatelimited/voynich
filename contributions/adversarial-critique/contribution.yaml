outcomes:
  - id: "outcome-adversarial-critique"
    family_id: "family-generative-falsification"
    extends: "outcome-languages-control"
    before: >-
      The family's headline numbers (10,120 types, ttr 0.289, H2|1 2.26, final-glyph 2.58,
      adjacent/distant Jaccard 0.080/0.042, 30% page-private) were taken as measured facts;
      "encyclopedia structure" was called ~90% confirmed; the residue was described as what
      device models cannot fake; no experiment had been run for the content side.
    after: >-
      The shared parser is shown to be contaminated (24% of types are artefacts) and every
      number is restated on a clean parse. The letter-pair constraint survives an alphabet
      confound test; the final-glyph anomaly does not survive it cleanly; the neighbouring-page
      and page-private structure claims are relabelled as language/section and hapax-richness
      artefacts by pre-registered rules; an untuned verbose cipher of Latin reproduces both
      entropy residues. The family's probability judgments are shown to rest on measurements
      that were partly artefacts.
    acceptance_test: >-
      Run the documented command; confirm results.json verdicts: R0.1 CONTAMINATED, R0.2
      RICHEST SURVIVES, R1.1 ALPHABET-ROBUST, R1.2 ALPHABET-DEPENDENT, R2.1 NOT REPRODUCED BY
      TESTED CIPHERS, R3.1 LANGUAGE/SECTION ARTEFACT, R3.2 HAPAX-RICHNESS CONSEQUENCE, R4.1
      SURVIVES; clean types 7,734 (comma=space) / 8,804 (comma=no space); within-class
      adjacency ratio 1.137; page-private 0.193 vs null 0.166.
    evidence:
      - "experiments/adversarial-critique/PROTOCOL.md"
      - "experiments/adversarial-critique/adversarial_critique.py"
      - "experiments/adversarial-critique/REPORT.md"
      - "experiments/adversarial-critique/results/results.json"
      - "experiments/adversarial-critique/results/source_hashes.json"
      - "experiments/runs/2026-09-07T013500Z-adversarial-critique/run.json"
    related_outcomes: ["outcome-generative-doodler-pilot", "outcome-entry-doodler-pilot", "outcome-m4-template-doodler-pilot", "outcome-m5-grille-pilot", "outcome-controls-entry-ladder", "outcome-poetry-control", "outcome-languages-control"]
    claimed_cumulative_tier: 5
    claimed_incremental_points: 2
    claim_rationale: >-
      Atlas "Experiments": bounded verified improvement (2) — a pre-registered critique that
      corrects the family's shared measurement, re-labels two structural claims by frozen
      rules, and gives the content side its first executed test. Family cumulative stays 5.
