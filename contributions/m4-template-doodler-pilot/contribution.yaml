limitations:
  - "Controls are English; a medieval Latin/Italian control is still needed for era match."
  - "M4 slot weights are corpus-estimated; circle insertion probabilities are heuristic."
  - "Single seed, coarse grid, sampled distant-Jaccard pairs; Alice chunks are artificial pages."
  - "Rule-faked and rule-encrypted content remain observationally close under this metric family."
