schema_version: "1.0"
id: "m4-template-doodler-pilot"
kind: research
title: "Template doodler on Stolfi's published word grammar, with real-language positive controls"
summary: >-
  Third executed pilot in the generative-falsification family. Adds the missing positive
  controls: Culpeper's Complete Herbal (PG 49513, real encyclopedia with real per-herb
  entries) and Alice in Wonderland (repo pg11.txt) measured with the identical metric
  suite. Controls show the manuscript's residual anomalies (conditional entropy 2.26 bits,
  final-char entropy 2.59, 30% entry-private vocabulary) are also where it differs from
  real language — reframing earlier "unmatched" results away from the linguistic-content
  reading. M4 implements Stolfi's published word grammar (2000a: core/mantle/crust
  unimodal hill), which covers 86% of corpus word types with zero fitting; the
  template+entry generator matches vocabulary size, type/token ratio, word length and
  neighbor-page sharing simultaneously. Residual: H2|1, final-char entropy, Zipf slope,
  entry-private share overshoot — a mechanical-repetition signature compatible with both
  weighted table-and-grille production and ciphered content.
branch_ids: ["generative-mechanisms", "statistical-structure", "corpus-integrity"]
