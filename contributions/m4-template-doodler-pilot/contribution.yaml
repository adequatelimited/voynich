outcomes:
  - id: "outcome-m4-template-doodler-pilot"
    family_id: "family-generative-falsification"
    extends: "outcome-entry-doodler-pilot"
    before: >-
      Pilots 1-2 compared content-free generators against the manuscript without positive
      controls, so "unmatched by the doodler" could be misread as evidence of linguistic
      content; no published word grammar had been implemented against the pinned corpus.
    after: >-
      Real-language controls (one real encyclopedia, one narrative) measured identically
      show the manuscript's residual anomalies are also non-language-like; Stolfi's
      published grammar is shown to cover 86% of word types and to raise generator fidelity
      to vocabulary size, reuse, length and page structure. The open question is narrowed
      to a mechanical-repetition signature shared by weighted-grille production and cipher.
    acceptance_test: >-
      Run the documented command; confirm results.json matches the recorded output:
      control H2|1 >= 3.1 for both controls vs 2.26 for the corpus; Stolfi grammar coverage
      >= 0.85 of types; best M4 within +-10% of corpus types and ttr while H2|1 remains
      >= 0.4 bits above the corpus.
    evidence:
      - "experiments/m4-template-doodler/m4_doodler.py"
      - "experiments/m4-template-doodler/report.md"
      - "experiments/m4-template-doodler/results/results.json"
      - "experiments/runs/2026-09-07T060000Z-m4-template-pilot/output.json"
      - "data/corpora/pg49513.txt"
      - "data/manifests/pg49513.json"
    related_outcomes: ["outcome-generative-doodler-pilot", "outcome-entry-doodler-pilot"]
    claimed_cumulative_tier: 5
    claimed_incremental_points: 2
    claim_rationale: >-
      Atlas "Experiments": incremental bounded verified improvement (2) — adds positive
      controls that change the interpretation of the family's earlier results and a
      published-grammar implementation with measured coverage. Family cumulative stays 5;
      not 10 — single seed, English controls, no independent execution.
    attribution:
      - github_id: 859355
        share_basis_points: 10000
claimed_total_points: 2
