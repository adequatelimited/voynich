    extends: "outcome-controls-entry-ladder"
    before: >-
      The final-glyph residue (2.59 bits) had no real-language control for constrained
      endings; versification was an untested alternative explanation.
    after: >-
      Rhymed verse is measured and excluded: even the rhyme position (3.50 bits) does not
      approach the manuscript's every-word 2.59; the manuscript's line-final position is
      anti-constrained relative to its average word, opposite of rhyme. The residue
      stands after its hardest real-language control.
    acceptance_test: >-
      Run the documented command; confirm results.json matches: sonnet line-final
      final-char entropy in [3.3, 3.7], prose controls in [3.5, 3.8], Voynich all-word
      final-char entropy in [2.5, 2.7] and Voynich line-final above its all-word value.
