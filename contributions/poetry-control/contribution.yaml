schema_version: "1.0"
id: "poetry-control-line-endings"
kind: research
title: "Poetry control: rhyme does not explain the manuscript's word-ending discipline"
summary: >-
  Control experiment in the generative-falsification family, from a hypothesis by Vasily
  Gnuchev: maybe the manuscript's word-final predictability is versification-like
  discipline. Line-structured metrics over the pinned corpus' real lines vs Shakespeare's
  Sonnets (strict rhyme) vs prose pseudo-lines at the Voynich mean line length. Rhyme
  position in sonnets reaches only 3.50 bits final-char entropy — far above the
  manuscript's every-word 2.59; verse recycles a few rhyming words (thee/me/be) while the
  manuscript constrains endings across 10k types. Versification is excluded as an
  explanation of the final-glyph residue. Side observation: the manuscript's line-final
  position is LESS constrained than its average word (2.99 vs 2.59) — opposite of rhyme.
branch_ids: ["generative-mechanisms", "statistical-structure"]
contributors:
  - github_id: 859355
    github_login: "gnuchev"
    roles: ["Conceptualization", "Formal analysis"]
