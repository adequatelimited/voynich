outcomes:
  - id: "outcome-generative-doodler-pilot"
    family_id: "family-generative-falsification"
    extends: null
    before: >-
      The 'meaningless but structured production' hypothesis (Rugg grille, Schinner self-citation,
      artistic pseudo-script) was represented in the repo as an open direction without executed,
      repo-reproducible comparisons against the pinned corpus.
    after: >-
      A runnable harness plus a completed pilot quantifies which corpus properties a content-free
      process already reproduces (ttr, H1, vocabulary growth) and which it does not (H2|1,
      word-final entropy, Zipf slope), localizing where real structure or stronger production
      rules must hide. Includes a diagnostic result on mutation-driven type explosion.
    acceptance_test: >-
      Run the documented command; confirm results.json matches the recorded output and that the
      three residual properties listed in report.md hold (H2|1 >= 0.4 bits above corpus,
      word-final entropy above corpus, Zipf slope shallower than corpus) for every M2 grid variant.
    evidence:
