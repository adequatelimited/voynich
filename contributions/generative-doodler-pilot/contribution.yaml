schema_version: "1.0"
id: "generative-doodler-pilot"
kind: research
title: "The doodler test: a content-free self-citation generator vs. the Voynich statistical fingerprint"
summary: >-
  Executed pilot experiment in the generative-mechanisms branch. Three content-free models
  (random null, Rugg-style syllable table, Schinner-style self-citation with Simon preferential
  reuse) were generated at corpus size and compared against the repo-pinned ZL3b corpus on 10
  quantitative properties. Result: the coarse fingerprint (type/token ratio, unigram entropy,
  vocabulary growth) is reproducible without content, but conditional bigram entropy,
  word-final predictability and the Zipf slope remain unmatched by the parameterized doodler.
  A diagnostic finding: copy-and-mutate alone explodes type diversity; ~40% preferential
  verbatim reuse is required, i.e. the real text recycles its vocabulary more deliberately
  than naive improvisation. Deterministic stdlib-only code, one command, one seed.
