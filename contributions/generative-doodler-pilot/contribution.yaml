limitations:
  - "Single corpus (ZL3b), single seed, heuristic composite distance, coarse grid."
  - "M2 habit set is corpus-derived: content-free but not corpus-free; residual misses occur despite this advantage."
  - "Not a replication of Rugg (2004) or Schinner (2007); no comparison to their published runs."
  - "Line-level structure and Currier A/B split not modeled in this pilot."
