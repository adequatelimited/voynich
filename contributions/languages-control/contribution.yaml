outcomes:
  - id: "outcome-languages-control"
    family_id: "family-generative-falsification"
    extends: "outcome-poetry-control"
    before: >-
      All controls were English; the morphology objection (an inflected language might
      naturally show manuscript-like endings) was untested.
    after: >-
      Nine languages on identical content show none reaches the manuscript on either
      residual property; the nearest (Finnish, 2.80 vs 2.58) still falls short, and the
      manuscript's type diversity exceeds every tested language. The morphology objection
      is answered for the tested language set.
    acceptance_test: >-
      Run the documented command; confirm results.json matches: every language's
      word-final entropy above the manuscript's 2.58 (nearest Finnish ~2.80) and every
      language's H2|1 above 2.26 (nearest Greek ~3.14), with manuscript ttr highest.
    evidence:
