      human_verification: >-
        The morphology hypothesis (test inflected languages; a Russian primer was also
        suggested) was contributed by Vasily Gnuchev, 2026-09-07. XML parsing spot-checked
        (token counts per language); all numbers from the recorded run output.
  reproducibility_notes: >-
