schema_version: "1.0"
id: "languages-control-morphology"
kind: research
title: "Multilingual same-text controls: no tested language reaches the manuscript's word-ending discipline"
summary: >-
  Multilingual control in the generative-falsification family, from a hypothesis by
  Vasily Gnuchev: maybe a morphologically rich language naturally produces the
  manuscript's word-ending predictability. The same text (Bible) in 9 languages at equal
  35k-token samples, identical metrics. No language reaches the manuscript: nearest on
  final-glyph entropy is Finnish (2.80 vs 2.58), nearest on letter-pair entropy is Greek
  (3.14 vs 2.26); the manuscript also has the highest type diversity (0.289). Russian,
  despite rich inflection, has the least predictable endings (4.23) — inflection alone
  does not produce the discipline. Plain-natural-language reading weakens further;
  encoded/invented-language and device readings unaffected.
branch_ids: ["generative-mechanisms", "statistical-structure", "historical-comparanda"]
contributors:
  - github_id: 859355
    github_login: "gnuchev"
    roles: ["Conceptualization", "Formal analysis", "Resources"]
ai_usage:
