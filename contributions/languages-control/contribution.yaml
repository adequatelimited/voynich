      model_id: "kimi-k3"
      model_version: "kimi-code/k3 (Kimi Code CLI; model string from local CLI config, 2026-09)"
      accessed_at: "2026-09-07"
      tasks:
        - "Implementation of languages_control.py (XML parsing, sampling, metrics)"
        - "Retrieval of the same-text multilingual corpus"
