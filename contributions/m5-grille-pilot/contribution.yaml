schema_version: "1.0"
id: "m5-grille-pilot"
kind: research
title: "Weighted table-and-grille generator built from the manuscript: row coupling steepens Zipf and matches page structure"
summary: >-
  Fourth executed pilot in the generative-falsification family. Implements the Cardan
  table-and-grille mechanism (Rugg 2004; Zandbergen 2021) with the table built from the
  pinned corpus itself via Stolfi-layer word parsing. Two devices compared: independent
  weighted columns (M5a) and the faithful row-coupled grille with fixed hole offsets
  (M5b). M5b is the best content-free model so far (composite distance 0.50 vs 0.94 for
  M4): Zipf slope steepens to -0.84 (real -1.05), adjacent/distant page sharing matched
  (0.077/0.045 vs 0.080/0.042), word length matched. Row coupling beats independent
  columns in every configuration. Residual narrowed to exactly two local properties:
  conditional bigram entropy (2.89 vs 2.26) and word-final predictability (3.11 vs 2.59);
  device models overshoot entry-private vocabulary (0.38 vs 0.30), consistent with a
  reused rather than regenerated table. Multi-seed stability verified (SD <= 0.02 on
  entropy metrics, seeds 101/202/303).
