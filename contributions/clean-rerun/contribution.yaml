outcomes:
  - id: "outcome-clean-rerun"
    family_id: "family-generative-falsification"
    extends: "outcome-adversarial-critique"
    before: >-
      The pilots' model comparisons (PRs #3-#6) were made in-sample on a contaminated parse,
      with configuration selected on the metrics then reported as matched, and the family
      narrative was one of progressive improvement ending in the row-coupled grille at
      composite 0.50.
    after: >-
      On the clean target with FIT-only tables and held-out scoring the ranking reverses
      (M2 best, M4 worst; M5b 0.84-1.14); at most 3 of 9 properties are matched by any
      model; the entropy, Zipf and hapax residues are matched by none; a dead grid parameter
      in pilot 1 is documented; and twelve untuned ciphers with corrected gates show that the
      joint fingerprint (short words, high type ratio, low entropies) is not delivered by
      simple encodings either.
    acceptance_test: >-
      Run the documented command; confirm results.json: TEST composites under S M2 0.694,
      M3 0.765, M5b 1.136, M5 1.429, M4 1.874; held-out match counts 3/2/2/1/1; R6.1 no
      cipher passes all five gates; gen_m2_fast equivalence check passes at start-up.
    evidence:
      - "experiments/clean-rerun/PROTOCOL.md"
      - "experiments/clean-rerun/clean_rerun.py"
      - "experiments/clean-rerun/family_generators.py"
      - "experiments/clean-rerun/REPORT.md"
      - "experiments/clean-rerun/results/results.json"
      - "experiments/runs/2026-09-07T093000Z-clean-rerun/run.json"
    related_outcomes: ["outcome-adversarial-critique", "outcome-generative-doodler-pilot", "outcome-entry-doodler-pilot", "outcome-m4-template-doodler-pilot", "outcome-m5-grille-pilot"]
    claimed_cumulative_tier: 5
    claimed_incremental_points: 2
    claim_rationale: >-
      Atlas "Experiments": bounded verified improvement (2) — a pre-registered held-out
      re-evaluation of every model in the family that changes the family's ranking and
      residue statement. Family cumulative stays 5.
    attribution:
