        share_basis_points: 10000
claimed_total_points: 2
rubric_version: "0.1"
conflicts: []
limitations:
  - "The alternating page split makes FIT and TEST halves statistically near-identical, so R5.3 (selection optimism) has little power; the design mainly tests the FIT-only habit tables."
  - "gen_m2 was replaced by an exact-semantics Fenwick-tree version for speed; equality with the vendored original is asserted at start-up on 3,000 tokens."
  - "Only twelve untuned cipher families; failure to reproduce is weak evidence by design."
