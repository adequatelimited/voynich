schema_version: "1.0"
id: "clean-rerun-held-out"
kind: research
title: "Clean held-out re-run of the generative-falsification pilots: ranking reversed, no model matches the entropy, Zipf or hapax residues"
summary: >-
  Second pre-registered protocol after the adversarial critique (PR #10). All five
  content-free generators of the family (M2 self-citation, M3 entry doodler, M4 Stolfi
  template, M5 grille, M5b row-coupled grille) re-run with their code unchanged on the
  clean parse, with habit tables built from a FIT half of the pages, configuration chosen
  on FIT and scored on a held-out TEST half, under both treatments of uncertain spaces.
  The family's ranking reverses: M2 0.69 (best), M3 0.77, M5b 1.14 (was 0.50), M5 1.43,
  M4 1.87 on the family's own composite. No model matches more than 3 of 9 properties and
  none matches H2|1, final-char entropy, Zipf slope or hapax share out of sample. Pilot 1's
  p_new grid parameter is unreachable code. Twelve untuned ciphers of Latin and Culpeper
  under corrected five-way gates reproduce the entropy residues but never the joint
  fingerprint: word length against type ratio binds.
branch_ids: ["generative-mechanisms", "statistical-structure"]
