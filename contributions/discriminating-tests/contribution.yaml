conflicts: []
limitations:
  - "The crossover at 45 symbols is against Greek, whose raw alphabet already has 45 symbols; against the other languages the gap at 45-60 symbols is 0.2-0.6 bits."
  - "The illustration test's pre-registered statistic (whole-page Jaccard) has no power even in a real herbal; the size-corrected variant is exploratory and not yet pre-registered."
  - "Plant identifications are published proposals compiled in the ZL3b comments, uncertain and sometimes multiple; most 'same plant as' cross-references carry a question mark."
