schema_version: "1.0"
id: "discriminating-tests-resegmentation-illustration"
kind: research
title: "Two discriminating tests: data-chosen re-segmentation (hypothesis V. Gnuchev: two EVA symbols are one glyph) and illustration-linked vocabulary"
summary: >-
  Third pre-registered protocol in the family. T2 tests a hypothesis contributed by Vasily
  Gnuchev: that the manuscript's letter-pair predictability exists because two or three EVA
  letters are really one glyph. Byte-pair-style merging applied identically to the
  manuscript and eleven control corpora, compared at equal alphabet size: verdict
  SEGMENTATION-DEPENDENT by the frozen rule. Twenty frequency-chosen merges (ch dy ai ok ol
  ee sh in che aiin ot ar al qok or she eey ain daiin chedy) bring the manuscript's H2|1 to
  3.09 bits, the lowest language's value at the same 45-symbol alphabet. Caveats recorded:
  that language is Greek, whose raw tokenised alphabet already has 45 symbols (accented
  vowels); against Latin, Finnish, Italian and English the gap at 45-60 symbols is still
  0.2-0.6 bits; after 60 merges it is under 0.1 bit against every language; the
  association-criterion sensitivity closes the gap less (0.21 bits). The excess
  predictability is concentrated in a few dozen fixed letter groups, which single glyphs,
  cipher groups and device fragments all predict. T1 tests whether the text knows what is
  drawn, using only the transliteration's editorial plant identifications and "same plant
  as" cross-references: 12 herbal/pharmaceutical same-plant pairs and 28 similar-plant
  pairs against permutation and distance-matched nulls, with a Culpeper positive control.
  Verdict UNDERPOWERED: the control fails its gate (related Culpeper entries share no more
  whole-entry vocabulary than random ones, p 0.44), so the manuscript's null result
  (same-plant p 0.85; similar-plant pairs below their distance-matched null) carries no
  weight. An exploratory size-corrected content-word statistic gives the control power and
  finds nothing in the manuscript; proposed as T1 v2 for pre-registration.
