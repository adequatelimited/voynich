outcomes:
  - id: "outcome-discriminating-tests"
    family_id: "family-generative-falsification"
    extends: "outcome-clean-rerun"
    before: >-
      The letter-pair constraint was the family's one residue described as robust to the
      transcription alphabet (fixed merge sets only); the illustration-similarity test had
      been named as the one test able to separate content from device but never run.
    after: >-
      The letter-pair anomaly is SEGMENTATION-DEPENDENT by a frozen rule: it is concentrated
      in a few dozen fixed letter groups and is language-like at a 45-60-symbol inventory, so
      the family's statement must be restated at glyph level (hypothesis credit: Vasily
      Gnuchev). The illustration test is UNDERPOWERED by its own control; the form in which
      it has power (size-corrected content words) is identified and queued.
    acceptance_test: >-
      Run the documented command; confirm results.json: R8 gaps 0.652/0.151/0.065/0.089 at
      alphabet sizes 30/40/50/60, crossover at 45 symbols (k=20, 3.089); R7 control N3 p
      about 0.44, T1a N1 p about 0.85, T1b N3 p about 0.21 and N4 p about 0.996.
    evidence:
      - "experiments/discriminating-tests/PROTOCOL.md"
      - "experiments/discriminating-tests/discriminating_tests.py"
      - "experiments/discriminating-tests/REPORT.md"
      - "experiments/discriminating-tests/results/results.json"
      - "experiments/runs/2026-09-07T110000Z-discriminating-tests/run.json"
    related_outcomes: ["outcome-adversarial-critique", "outcome-clean-rerun", "outcome-languages-control"]
