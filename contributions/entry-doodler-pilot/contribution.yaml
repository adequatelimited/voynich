outcomes:
  - id: "outcome-entry-doodler-pilot"
    family_id: "family-generative-falsification"
    extends: "outcome-generative-doodler-pilot"
    before: >-
      Pilot 1 tested content-free generation against global text statistics only; document
      structure (per-page entries, topical ordering) was unmeasured and unmodeled.
    after: >-
      The corpus' page-level structure is now quantified (adjacent/distant Jaccard,
      page-unique vocabulary share) and shown reproducible by a content-free entry model;
      the unexplained residue is narrowed to word-internal grammar, sharpening the target
      for a discriminating template-model test.
    acceptance_test: >-
      Run the documented command; confirm results.json matches the recorded output and that
      the best M3 variant matches adjacent/distant/page-unique metrics within +-0.01 while
      remaining >=0.4 bits above corpus H2|1 and shallower on Zipf slope.
    evidence:
      - "experiments/entry-doodler/entry_doodler.py"
      - "experiments/entry-doodler/report.md"
      - "experiments/entry-doodler/results/results.json"
      - "experiments/runs/2026-09-06T201500Z-entry-doodler-pilot/output.json"
    related_outcomes: ["outcome-generative-doodler-pilot"]
    claimed_cumulative_tier: 5
    claimed_incremental_points: 2
    claim_rationale: >-
      Same family as pilot 1; incremental claim is a bounded verified improvement (2):
      new page-level measurements of the pinned corpus plus an extended harness that
      localizes the unexplained residue. Family cumulative stays at the pilot tier (5);
      not 10 — single seed/corpus, no independent execution.
    attribution:
      - github_id: 859355
        share_basis_points: 10000
claimed_total_points: 2
rubric_version: "0.1"
conflicts: []
limitations:
  - "Single corpus (ZL3b), single seed, heuristic composite distance; foldout adjacency inflates neighbor similarity slightly in both real and model data."
  - "Habit set is corpus-derived (content-free but not corpus-free); misses occur despite this advantage."
  - "carry/topic parameters fitted, not derived from paleographic evidence; GC2a cross-check pending."
