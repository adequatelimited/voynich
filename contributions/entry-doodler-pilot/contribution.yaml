schema_version: "1.0"
id: "entry-doodler-pilot"
kind: research
title: "The encyclopedia doodler: content-free per-page entry structure vs the Voynich page-level fingerprint"
summary: >-
  Second executed pilot in the generative-falsification family, extending
  outcome-generative-doodler-pilot. New real-corpus measurements establish that the
  manuscript is encyclopedia-structured: adjacent pages share 2x more vocabulary than
  distant pages (0.0804 vs 0.0422) and 30% of each page's word types are page-unique.
  A content-free entry-based generator (M3: per-page topic words with carry-over drift,
  preferential reuse, habit-driven invention) reproduces all three page-level metrics
  (0.075/0.035/0.279) plus vocabulary size, while the character-level residue from pilot 1
  (H2|1, word-final entropy, Zipf slope, word length) persists. The unexplained structure
  is localized to word-internal grammar.
branch_ids: ["generative-mechanisms", "statistical-structure", "layout-paleography"]
contributors:
