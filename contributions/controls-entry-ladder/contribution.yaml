outcomes:
  - id: "outcome-controls-entry-ladder"
    family_id: "family-generative-falsification"
    extends: "outcome-m5-grille-pilot"
    before: >-
      Entry-structure conclusions rested on a single scholarly-encyclopedia control
      (Culpeper), leaving open the objection that simpler reference genres behave
      differently.
    after: >-
      A four-genre real-text ladder (dictionary, kids' encyclopedia, scholarly
      encyclopedia, narrative) now anchors the entry metrics; the manuscript's
      entry-private vocabulary is extreme but on a continuum, and its neighbor-sharing
      matches the dictionary. Pilot 3's device-overshoot emphasis is corrected; the
      encoded-content reading regains ground.
    acceptance_test: >-
      Run the documented command; confirm results.json matches the recorded output:
      dictionary entry-unique share in [0.12, 0.16], kids' encyclopedia in [0.07, 0.09],
      both between Culpeper and the manuscript; dictionary adjacent Jaccard within 0.02
      of the manuscript's 0.080.
