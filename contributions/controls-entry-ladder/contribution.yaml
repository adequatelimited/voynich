schema_version: "1.0"
id: "controls-entry-ladder"
kind: research
title: "Entry-structure controls ladder: dictionary and kids' encyclopedia narrow the manuscript's gap"
summary: >-
  Controls extension in the generative-falsification family, motivated by a hypothesis contributed by Vasily
  Gnuchev (2026-09-07): pilot 3's "10x entry-private vocabulary" claim compared the manuscript only to
  a scholarly 1653 encyclopedia. Two more real genres measured with the identical suite:
  Devil's Dictionary (878 short entries) and The Wonder Book of Knowledge (164 children's
  Q&A entries). Result: entry-private vocabulary is genre- and length-dependent
  (scholarly 2.8% < kids 8.0% < dictionary 13.8% < Voynich 30.2%); the dictionary's
  neighbor-sharing (0.063) nearly equals the manuscript's (0.080). The manuscript stays
  the extreme but is on a continuum with real short-entry genres; this partially
  rehabilitates the encoded-content reading and weakens pilot 3's device-overshoot
  emphasis. New control texts committed with schema manifests and rights notes.
