[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voynich-research"
version = "0.1.0"
description = "Reproducible transcription analysis and translation-hypothesis testing for Beinecke MS 408"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

