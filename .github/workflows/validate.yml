name: Public package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unprivileged-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: npm install --global pnpm@10.28.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm build
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests/research -v
      - run: python tools/research/verify_replications.py
      # Candidate-code checks receive no model/write/deployment secrets.
      # The external attendant check independently decides authority/admission.
